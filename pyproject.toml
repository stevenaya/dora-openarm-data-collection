[project]
name = "dora-openarm-data-collection"
version = "0.1.0"
description = "Data collection configurations for OpenArm with dora-rs"
requires-python = ">=3.11"
dependencies = [
  "dora-rs==0.5.0",
  "dora-rs-cli==0.5.0",
  "fastapi[standard]",
  "mujoco>=3.6.0",
  "numpy>=2.4.4",
  "opencv-python",
  "opencv-video-capture",
  "pyarrow>=23.0.1",
  "pyyaml>=6.0",
  "scipy>=1.17.1",
  "uvicorn",
]

[dependency-groups]
core-pinned = [
  "openarm-driver",
  "openarm-ker",
  "openarm-mujoco",
]
dev-tools = [
  "ruff == 0.14.11",
]

[tool.uv]
package = false

[tool.uv.sources]
# Replace these refs with validated commit SHAs when freezing an integration.
openarm-driver = { git = "https://github.com/stevenaya/openarm_driver.git", rev = "1424f43d29bdcef8ddb2eabeca2eae891d914941" }
openarm-ker = { git = "https://github.com/stevenaya/openarm_ker.git", rev = "148cbddaf3c5e2109dc81b22dd030d8cdfd45c44" }
openarm-mujoco = { git = "https://github.com/stevenaya/openarm_mujoco.git", rev = "2b3440eb358ee297cf02daca3736bc16966c13f0" }
