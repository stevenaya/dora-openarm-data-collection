nodes:
  - id: ui
    build: ./scripts/install-node.sh -e nodes/dora-openarm-data-collection-ui
    # build: ./scripts/install-node.sh dora-openarm-data-collection-ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata.yaml"
    inputs:
      # We need at least one input to keep this node alive.
      tick: dora/timer/secs/1
    outputs:
      - command

  - id: quittable-tick-leader
    build: ./scripts/install-node.sh -e nodes/dora-openarm-quitter
    # build: ./scripts/install-node.sh dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - tick

  - id: ker
    build: ./scripts/install-node.sh -e nodes/dora-openarm-ker
    path: dora-openarm-ker
    args: "--device /dev/m5_ker_485 --config nodes/openarm_ker/config/mapping_m5.yaml"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - left_position
      - right_position
      - left_follower_position
      - right_follower_position
      - joystick_x
      - joystick_y
      - joystick_button

        #- id: lifter
        #  build: ./scripts/install-node.sh -e ../robot_data/node/dora-openarm-lifter
        #  path: dora-openarm-lifter
        #  inputs:
        #    joystick_y: ker/joystick_y
        #    joystick_button: ker/joystick_button

  - id: follower-right
    build: ./scripts/install-node.sh -e nodes/dora-openarm
    path: dora-openarm
    # args: "--side right --align-trigger gripper --config ../robot_data/config/openarm_cell.yaml"
    args: "--side right --align-trigger gripper --config nodes/openarm_driver/src/openarm_driver/openarm_cell.yaml"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_position: ker/right_follower_position
      move_position: ker/right_follower_position
    outputs:
      - position
      - status

  - id: follower-left
    build: ./scripts/install-node.sh -e nodes/dora-openarm
    path: dora-openarm
    args: "--side left --align-trigger gripper --config nodes/openarm_driver/src/openarm_driver/openarm_cell.yaml"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_position: ker/left_follower_position
      move_position: ker/left_follower_position
    outputs:
      - position
      - status

  - id: openarm-mujoco
    build: ./scripts/install-node.sh -e nodes/dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: " --viewer --enable-collision --keyframe home"
    inputs:
      right_position: follower-right/position
      left_position:  follower-left/position
    outputs:
      - status
      - arm_right_observation
      - arm_left_observation
      - camera_wrist_right
      - camera_wrist_left
      - camera_head
      - camera_ceiling
