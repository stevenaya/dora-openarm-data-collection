nodes:
  - id: ui
    build: ../scripts/install-node.sh dora-openarm-data-collection-ui
    path: dora-openarm-data-collection-ui
    env:
      METADATA_FILE: "metadata.yaml"
    inputs:
      # We need at least one input to keep this node alive.
      tick: dora/timer/secs/1
    outputs:
      - command

  - id: quittable-tick-leader
    build: ../scripts/install-node.sh dora-openarm-quitter
    path: dora-openarm-quitter
    inputs:
      command: ui/command
      # 250Hz
      tick: dora/timer/millis/4
    outputs:
      - tick

  - id: ker
    build: ../scripts/install-node.sh dora-openarm-ker
    path: dora-openarm-ker
    args: "--device /dev/m5_ker_485 --config mapping_m5.yaml"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - position_left
      - position_right
      - follower_position_left
      - follower_position_right
      - joystick_x
      - joystick_y
      - joystick_button

        #- id: lifter
        #  build: ../scripts/install-node.sh -e ../robot_data/node/dora-openarm-lifter
        #  path: dora-openarm-lifter
        #  inputs:
        #    joystick_y: ker/joystick_y
        #    joystick_button: ker/joystick_button

  - id: follower-right
    build: ../scripts/install-node.sh dora-openarm
    path: dora-openarm
    args: "--side right --align-trigger gripper --config openarm_v20_sysid.yaml"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_state: ker/follower_position_right
      move_position: ker/follower_position_right
    outputs:
      - position
      - state
      - status

  - id: follower-left
    build: ../scripts/install-node.sh dora-openarm
    path: dora-openarm
    args: "--side left --align-trigger gripper --config openarm_v20_sysid.yaml"
    inputs:
      # Event ID is only used. Event value isn't used.
      request_state: ker/follower_position_left
      move_position: ker/follower_position_left
    outputs:
      - position
      - state
      - status

  - id: openarm-mujoco
    build: ../scripts/install-node.sh dora-openarm-mujoco
    path: dora-openarm-mujoco
    args: " --viewer --enable-collision --keyframe home"
    inputs:
      position_right: follower-right/position
      position_left:  follower-left/position
    outputs:
      - status
      - arm_right_observation
      - arm_left_observation
      - camera_wrist_right
      - camera_wrist_left
      - camera_head_left
      - camera_head_right
      - camera_ceiling

  - id: recorder
    build: ../scripts/install-node.sh dora-openarm-dataset-recorder
    # build: pip install dora-openarm-dataset-recorder
    path: dora-openarm-dataset-recorder
    env:
      METADATA_FILE: "metadata.yaml"
      # Output directory for recorded datasets.
      # Default: directory containing dataflow.yaml
      # DIRECTORY: "/path/to/datasets"
    inputs:
      command: ui/command
      arm_right_action: ker/follower_position_right
      arm_right_observation: follower-right/state
      # camera_wrist_right: camera-wrist-right/image
      arm_left_action: ker/follower_position_left
      arm_left_observation: follower-left/state
      # camera_wrist_left: camera-wrist-left/image
      # camera_head_left: camera-head-stereo-splitter/image_0
      # camera_head_right: camera-head-stereo-splitter/image_1
      # camera_ceiling: camera-ceiling/image
      # elevation_action: lifter/elevation_action
      # elevation_observation: lifter/elevation_observation
